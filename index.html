<!doctype html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trading Journal</title>
<style>
:root{--bg:#0f1420;--cd:#192033;--tx:#e8ecf5;--mu:#8b95ad;--g:#2ecc8f;--r:#ff5c6c;--y:#f5b73d;--ac:#5b8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:env(safe-area-inset-top) 12px 80px}
h2{font-size:18px;margin:14px 0 8px}.cd{background:var(--cd);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 45%}
label{font-size:12px;color:var(--mu);display:block;margin-top:8px}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #2c3550;background:#0f1420;color:var(--tx);font-size:15px}
button{padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px;width:100%;margin-top:10px}
button.s{background:#2c3550}button.x{background:none;color:var(--r);width:auto;padding:4px 8px;margin:0}
.big{font-size:26px;font-weight:700}.mu{color:var(--mu);font-size:12px}.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;text-align:center}.k b{display:block;font-size:16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#141a2b;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:14px 0;color:var(--mu);font-size:13px}nav a.on{color:var(--ac);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:right}td:first-child,th:first-child{text-align:left}
.tr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #2c3550}
.p{display:none}.p.on{display:block}
</style></head><body>
<div id="dash" class="p on"></div>
<div id="add" class="p"></div>
<div id="jr" class="p"></div>
<div id="rep" class="p"></div>
<nav><a data-t="dash" class="on">Dashboard</a><a data-t="add">+ Trade</a><a data-t="jr">Journal</a><a data-t="rep">Report</a></nav>
<script>
const $=s=>document.querySelector(s),L=localStorage;
let T=JSON.parse(L.tj_trades||'[]');const save=()=>L.tj_trades=JSON.stringify(T);
const B=()=>+(L.tj_brk||60),f=n=>(n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN'),cl=n=>n>0?'g':n<0?'r':'';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00'),today=()=>iso(new Date());
function calc(t){const pts=t.action=='SELL'?t.entry-t.exit:t.exit-t.entry,rr=t.entry==t.sl?0:(t.exit-t.entry)/(t.entry-t.sl);
return{pts,rr,res:rr>0.5?'TP':rr>=0?'CTC':'SL',gross:pts*t.qty}}
function stats(l){const o={n:l.length,TP:0,CTC:0,SL:0,pts:0,gross:0,w:0,ls:0};
l.forEach(t=>{const c=calc(t);o[c.res]++;o.pts+=c.pts;o.gross+=c.gross;c.gross>0?o.w+=c.gross:o.ls-=c.gross});
o.brk=o.n*B();o.net=o.gross-o.brk;o.win=o.n?Math.round(o.TP/o.n*100):0;o.pf=o.ls?o.w/o.ls:(o.w?99:0);return o}
const ws=d=>{const x=new Date(d),k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x};
const fy=d=>{const y=d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;return[new Date(y,8,1),new Date(y+1,7,31)]};
const inR=(t,a,b)=>t.date>=iso(a)&&t.date<=iso(b);
let sel=null;
function card(h,s){return`<div class="cd"><div class="mu">${h}</div><div class="big ${cl(s.net)}">${f(s.net)}</div>
<div class="k"><span><b>${s.n}</b>trades</span><span><b>${s.pts.toFixed(1)}</b>points</span><span><b>${s.win}%</b>win</span>
<span class="g"><b>${s.TP}</b>TP</span><span class="y"><b>${s.CTC}</b>CTC</span><span class="r"><b>${s.SL}</b>SL</span></div></div>`}
function dash(){const last=T.length?T.map(t=>t.date).sort().pop():today();sel=sel||last;const d=pd(sel),w0=ws(d),w1=new Date(w0);w1.setDate(w0.getDate()+6);
const m0=new Date(d.getFullYear(),d.getMonth(),1),m1=new Date(d.getFullYear(),d.getMonth()+1,0),[y0,y1]=fy(d);
const Y=T.filter(t=>inR(t,y0,y1)),sy=stats(Y),days={};Y.forEach(t=>(days[t.date]=days[t.date]||[]).push(t));
let c=0,pk=0,dd=0,pts=[];Object.keys(days).sort().forEach(k=>{c+=stats(days[k]).net;pts.push(c);pk=Math.max(pk,c);dd=Math.min(dd,c-pk)});
const mx=Math.max(...pts,1),mn=Math.min(...pts,0),sp=mx-mn||1,svg=pts.length>1?`<svg viewBox="0 0 300 80" width="100%"><polyline fill="none" stroke="#5b8cff" stroke-width="2" points="${pts.map((v,i)=>(i/(pts.length-1)*300).toFixed(1)+','+(75-(v-mn)/sp*70).toFixed(1)).join(' ')}"/></svg>`:'<div class="mu">Equity curve ke liye 2+ trading days chahiye</div>';
$('#dash').innerHTML=`<h2>Dashboard</h2><label>Date chuno</label><input type="date" value="${sel}" onchange="sel=this.value;dash()">
${card('DAY - '+sel,stats(T.filter(t=>t.date==sel)))}${card('WEEK',stats(T.filter(t=>inR(t,w0,w1))))}${card('MONTH',stats(T.filter(t=>inR(t,m0,m1))))}
${card('YEAR  '+iso(y0)+' → '+iso(y1),sy)}
<div class="cd"><div class="mu">EQUITY CURVE (year)</div>${svg}<div class="k"><span><b>${sy.pf.toFixed(2)}</b>Profit factor</span><span class="r"><b>${f(dd)}</b>Max drawdown</span><span><b>${f(sy.brk)}</b>Brokerage</span></div></div>`}
function add(){const q=L.tj_qty||65;$('#add').innerHTML=`<h2>Naya Trade</h2><div class="cd">
<div class="row"><div><label>Date</label><input id="d" type="date" value="${today()}"></div><div><label>Time</label><input id="tm" type="time" value="${new Date().toTimeString().slice(0,5)}"></div></div>
<div class="row"><div><label>Script</label><input id="sc" value="${L.tj_sc||'Nifty50'}"></div><div><label>Strike</label><input id="st" placeholder="22550 CE"></div></div>
<div class="row"><div><label>Action</label><select id="ac"><option>BUY</option><option>SELL</option></select></div><div><label>Quantity</label><input id="q" type="number" value="${q}"></div></div>
<div class="row"><div><label>Entry</label><input id="en" type="number" step="any"></div><div><label>Stoploss</label><input id="sl" type="number" step="any"></div></div>
<div class="row"><div><label>Target</label><input id="tg" type="number" step="any"></div><div><label>Exit</label><input id="ex" type="number" step="any"></div></div>
<button onclick="addT()">Save Trade</button></div>`}
function addT(){const v=i=>$('#'+i).value,n=i=>parseFloat(v(i));
if(isNaN(n('en'))||isNaN(n('sl'))||isNaN(n('ex'))||!n('q'))return alert('Entry, Stoploss, Exit aur Quantity bharo');
T.push({id:Date.now(),date:v('d'),time:v('tm'),script:v('sc'),strike:v('st'),action:v('ac'),qty:n('q'),entry:n('en'),sl:n('sl'),target:n('tg')||0,exit:n('ex')});
L.tj_qty=n('q');L.tj_sc=v('sc');save();const c=calc(T[T.length-1]);alert(c.res+'  |  '+c.pts.toFixed(2)+' pts  |  '+f(c.gross-B()));add();show('jr')}
function jr(){const g={};T.forEach(t=>(g[t.date]=g[t.date]||[]).push(t));
let h='<h2>Journal</h2>';Object.keys(g).sort().reverse().forEach(k=>{const s=stats(g[k]);h+=`<div class="cd"><b>${k}</b> <span class="${cl(s.net)}" style="float:right">${f(s.net)}</span>`;
g[k].sort((a,b)=>(a.time||'')<(b.time||'')?-1:1).forEach(t=>{const c=calc(t);h+=`<div class="tr"><div>${t.script} ${t.strike} <span class="mu">${t.action} ×${t.qty}<br>${t.entry} → ${t.exit} (SL ${t.sl})</span></div>
<div style="text-align:right"><b class="${c.res=='TP'?'g':c.res=='SL'?'r':'y'}">${c.res}</b><br><span class="${cl(c.gross)}">${f(c.gross)}</span> <button class="x" onclick="del(${t.id})">✕</button></div></div>`});h+='</div>'});
if(!T.length)h+='<div class="cd mu">Abhi koi trade nahi.</div>';
h+=`<div class="cd"><label>Brokerage per trade (₹)</label><input type="number" value="${B()}" onchange="L.tj_brk=this.value">
<button class="s" onclick="bk()">Backup copy karo (clipboard)</button><label>Restore: backup yahan paste karo</label><textarea id="rs" rows="3"></textarea><button class="s" onclick="rest()">Restore</button></div>`;$('#jr').innerHTML=h}
function del(id){if(confirm('Delete karna hai?')){T=T.filter(t=>t.id!=id);save();jr()}}
function bk(){const s=JSON.stringify(T);(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>alert('Copy ho gaya. Kahin save kar lo (Notes/WhatsApp).'),()=>{$('#rs').value=s;alert('Text box se copy karo')})}
function rest(){try{const a=JSON.parse($('#rs').value);if(!Array.isArray(a))throw 0;T=a;save();alert(a.length+' trades restore hue');jr()}catch(e){alert('Backup text sahi nahi hai')}}
function rep(){const d=pd(sel||today()),[y0]=fy(d),mn=['Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'];let c=0,h=`<h2>Yearly Report</h2><div class="cd"><table><tr><th>Month</th><th>Trades</th><th>TP/CTC/SL</th><th>Pts</th><th>Net</th></tr>`;
for(let i=0;i<12;i++){const a=new Date(y0.getFullYear(),8+i,1),b=new Date(y0.getFullYear(),9+i,0),s=stats(T.filter(t=>inR(t,a,b)));c+=s.net;
h+=`<tr><td>${mn[i]} ${String(a.getFullYear()).slice(2)}</td><td>${s.n}</td><td>${s.TP}/${s.CTC}/${s.SL}</td><td>${s.pts.toFixed(1)}</td><td class="${cl(s.net)}">${f(s.net)}</td></tr>`}
$('#rep').innerHTML=h+`</table><div class="k"><span></span><span class="${cl(c)}"><b>${f(c)}</b>Year net</span><span></span></div></div>`}
const R={dash,add,jr,rep};
function show(t){document.querySelectorAll('.p').forEach(e=>e.classList.toggle('on',e.id==t));document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t==t));R[t]()}
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>show(a.dataset.t));dash();add();
</script></body></html>
